<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in — EduFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <a class="brand" href="/" style="margin-bottom:24px;display:inline-flex">
                <span class="logo">E</span><span>EduFlow</span>
            </a>
            <h1>Welcome back</h1>
            <p class="sub">Sign in to your account or create a new one.</p>

            <div class="tabs">
                <button class="active" data-tab="login">Sign in</button>
                <button data-tab="register">Register</button>
            </div>

            <div class="alert" id="auth-alert" style="display:none"></div>

            <form id="login-form">
                <div class="field"><label>Email</label><input name="email" type="email" required></div>
                <div class="field"><label>Password</label><input name="password" type="password" required></div>
                <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
                <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:16px">
                    Demo admin: <code>admin@school.local</code> / <code>admin123</code>
                </p>
            </form>

            <form id="register-form" style="display:none">
                <div class="field"><label>Full name</label><input name="name" required></div>
                <div class="field"><label>Email</label><input name="email" type="email" required></div>
                <div class="field"><label>Password</label><input name="password" type="password" minlength="6" required>
                </div>
                <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
            </form>
        </div>
    </div>
    <script type="module" src="/js/auth.js"></script>
</body>

</html>
